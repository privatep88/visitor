    <script>
      (function () {
        var isResizeObserverMsg = function (val) {
          if (!val) return false;
          var msg = typeof val === 'string' ? val : (val.message || String(val));
          return (
            msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            msg.indexOf('ResizeObserver loop limit exceeded') !== -1 ||
            msg.indexOf('ResizeObserver') !== -1
          );
        };

        var suppressResizeObserverEvent = function (event) {
          var msg = event && (event.message || (event.error && event.error.message) || event.reason);
          if (isResizeObserverMsg(msg)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
          return false;
        };

        window.addEventListener('error', suppressResizeObserverEvent, true);
        window.addEventListener('error', suppressResizeObserverEvent, false);
        window.addEventListener('unhandledrejection', suppressResizeObserverEvent, true);

        var prevOnError = window.onerror;
        window.onerror = function (message, source, lineno, colno, error) {
          if (isResizeObserverMsg(message) || isResizeObserverMsg(error)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        if (typeof window.ResizeObserver === 'function') {
          var OriginalResizeObserver = window.ResizeObserver;
          window.ResizeObserver = function (callback) {
            var rafId = null;
            return new OriginalResizeObserver(function (entries, observer) {
              if (rafId !== null) {
                window.cancelAnimationFrame(rafId);
              }
              rafId = window.requestAnimationFrame(function () {
                rafId = null;
                try {
                  callback(entries, observer);
                } catch (err) {
                  if (!isResizeObserverMsg(err)) {
                    throw err;
                  }
                }
              });
            });
          };
          window.ResizeObserver.prototype = OriginalResizeObserver.prototype;
        }
      })();
    </script>
